<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Pulse — Ride Demand Forecast{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a href="/" class="brand">
      <span class="mark">◍</span> PULSE
      <span class="tag">ride demand forecast system</span>
    </a>
    <div class="topbar-meta">
      <span class="badge model-badge">⚡ ML Engine Active · R² ≈ 0.79</span>
    </div>
  </header>

  {% block content %}{% endblock %}

  <footer class="foot">
    <div><strong>Pulse Ride Demand</strong> · Intelligence & Analytics Engine</div>
    <div>Designed & Built by Tarun P</div>
  </footer>
</div>
</body>
</html>
